<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ APP_NAME }} — {% block title %}{{ APP_TAGLINE }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">{{ APP_NAME }}</span>
      <span class="brand-sub">— {{ APP_TAGLINE }}</span>
    </div>
    <div class="topbar-right">
      <span class="src-pill {{ 'live' if not use_mock }}">{{ 'MOCK DATA' if use_mock else 'LIVE API' }}</span>
      <button class="theme-toggle" id="theme-toggle" type="button">Light</button>
    </div>
  </header>

  <nav class="tabs">
    {% for endpoint, label in nav %}
      <a class="tab {{ 'active' if active == endpoint }}" href="{{ url_for(endpoint) }}">{{ label }}</a>
    {% endfor %}
  </nav>

  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
