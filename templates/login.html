{# Sign-in page, shown to anyone who isn't logged in yet. #}
<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ APP_NAME }} — sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" method="post">
    <div class="login-brand">{{ APP_NAME }}</div>
    <div class="login-sub">{{ APP_TAGLINE }}</div>
    {% if error %}<div class="note bad">{{ error }}</div>{% endif %}
    <input class="input" type="password" name="password" placeholder="Password" autofocus>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
